site_name: Unix/Linux SIEM Integration Guide
site_description: >-
  Forward authentication and system logs from Unix/Linux servers (FreeBSD, RHEL 6-9,
  Debian, Ubuntu) to your SIEM using rsyslog and FreeBSD syslogd.
site_url: https://yukselao.github.io/unix-linux-siem-integration-guide/
repo_url: https://github.com/yukselao/unix-linux-siem-integration-guide
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    scheme: default
    primary: indigo
    accent: deep orange
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - search.share

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/js/jquery.min.js
  - assets/js/chart.umd.min.js
  - assets/js/extra.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: tr
          name: Türkçe
          build: true
          nav_translations:
            Home: Ana Sayfa
            How it works: Nasıl çalışır
            Configure: Yapılandırma
            Test & verify: Test & doğrulama
            Troubleshooting: Sorun giderme
            Reference & cheat sheet: Referans & özet kartı

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Configure:
      - Red Hat (RHEL 6–9): redhat.md
      - Debian & Ubuntu: debian-ubuntu.md
      - FreeBSD: freebsd.md
  - Test & verify: verify.md
  - Troubleshooting: troubleshoot.md
  - Reference & cheat sheet: reference.md
